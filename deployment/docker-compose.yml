version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/backend
      - vector_data:/app/vectorDB
      - raw_data:/app/data
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./backend/carnatic_gpt.db
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Frontend compiled files served by nginx in production
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
  vector_data:
  raw_data:
